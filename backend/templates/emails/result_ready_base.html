<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}OrthoRad{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#F5EDE3;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5EDE3; padding:32px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%; background-color:#FFFCF7; border-radius:12px; overflow:hidden;">
        <tr>
          <td align="center" style="padding:32px 32px 16px;">
            <img src="{{ logo_url }}" width="180" alt="OrthoRad" style="display:block; width:180px; max-width:180px; height:auto;">
          </td>
        </tr>
        <tr>
          <td style="padding:8px 32px 24px; font-family:Arial, Helvetica, sans-serif; color:#4A4A4A; font-size:15px; line-height:1.6;">
            {% block body %}{% endblock %}
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:0 32px 36px;">
            <table role="presentation" cellpadding="0" cellspacing="0">
              <tr>
                <td align="center" bgcolor="#4F8A7B" style="border-radius:8px;">
                  <a href="{{ login_url }}" target="_blank" style="display:inline-block; padding:14px 32px; font-family:Arial, Helvetica, sans-serif; font-size:15px; font-weight:bold; color:#FFFFFF; text-decoration:none;">
                    Ver resultados
                  </a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px 28px; border-top:1px solid #F5EDE3; font-family:Arial, Helvetica, sans-serif; color:#4A4A4A; font-size:11px; line-height:1.6;" align="center">
            Este es un mensaje automático de OrthoRad. Por favor no respondas a este correo.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
